# Ambiente de desenvolvimento (ADR 0004, docs/specs/ambiente-docker.md).
# Uso: cp .env.example .env && docker compose up
name: augusto-barbearia

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-augusto}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-augusto}
      POSTGRES_DB: ${POSTGRES_DB:-augusto}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./api
      target: dev
    environment:
      APP_NAME: ${APP_NAME:-Augusto Barbearia API}
      DATABASE_URL: ${DATABASE_URL:-}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      AUTH_JWKS_URL: ${AUTH_JWKS_URL:-}
      AUTH_ISSUER: ${AUTH_ISSUER:-}
      AUTH_AUDIENCE: ${AUTH_AUDIENCE:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      WEB_BASE_URL: ${WEB_BASE_URL:-}
    ports:
      - "8000:8000"
    volumes:
      - ./api:/app
      - /app/.venv
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 5s
      timeout: 5s
      retries: 12

  web:
    build:
      context: ./web
      target: dev
    environment:
      DATABASE_URL: ${DATABASE_URL:-}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      AUTH_ISSUER: ${AUTH_ISSUER:-}
      AUTH_AUDIENCE: ${AUTH_AUDIENCE:-}
      API_INTERNAL_URL: ${API_INTERNAL_URL:-http://api:8000}
      # Modo demonstração (#199): entrada sem Google nas contas fictícias.
      DEMO_LOGIN_ENABLED: ${DEMO_LOGIN_ENABLED:-false}
    ports:
      - "3000:3000"
    volumes:
      - ./web:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      api:
        condition: service_healthy

volumes:
  db-data:
